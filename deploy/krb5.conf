# Configuration Kerberos minimale. L'application ne fait que VALIDER les tickets
# présentés par les navigateurs grâce au keytab : aucun mot de passe n'est stocké.
[libdefaults]
    default_realm = LOCAL.LAN
    dns_lookup_realm = false
    dns_lookup_kdc = true
    rdns = false
    # Ne pas exiger que le nom d'hôte du conteneur corresponde au SPN :
    ignore_acceptor_hostname = true

[realms]
    LOCAL.LAN = {
        # Facultatif si les enregistrements SRV DNS sont disponibles.
        # kdc = dc01.local.lan
    }

[domain_realm]
    .local.lan = LOCAL.LAN
    local.lan = LOCAL.LAN
